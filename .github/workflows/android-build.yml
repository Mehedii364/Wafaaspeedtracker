name: Android CI / CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Wafa Speed Tracker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean --stacktrace --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Validate and Copy Debug APK
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: Debug APK file $APK_SOURCE was not found!"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$APK_SOURCE" 2>/dev/null || stat -f%z "$APK_SOURCE")
          if [ "$FILE_SIZE" -le 1048576 ]; then
            echo "ERROR: Debug APK file size is less than 1MB ($FILE_SIZE bytes)!"
            exit 1
          fi
          echo "SUCCESS: Valid Debug APK created with size $FILE_SIZE bytes ($APK_SOURCE)."
          mkdir -p .build-outputs APK_DOWNLOAD
          cp -v "$APK_SOURCE" .build-outputs/app-debug.apk
          cp -v "$APK_SOURCE" APK_DOWNLOAD/app-debug.apk
          sha256sum .build-outputs/app-debug.apk
          sha256sum APK_DOWNLOAD/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: APK_DOWNLOAD/app-debug.apk
          if-no-files-found: error

      - name: Build Android App Bundle (AAB)
        run: ./gradlew bundleDebug --stacktrace --no-daemon

      - name: Validate and Copy App Bundle
        run: |
          AAB_SOURCE="app/build/outputs/bundle/debug/app-debug.aab"
          if [ ! -f "$AAB_SOURCE" ]; then
            echo "ERROR: App Bundle $AAB_SOURCE was not found!"
            exit 1
          fi
          mkdir -p .build-outputs AAB_DOWNLOAD
          cp -v "$AAB_SOURCE" .build-outputs/app-debug.aab
          cp -v "$AAB_SOURCE" AAB_DOWNLOAD/app-debug.aab
          echo "SUCCESS: Valid AAB created and copied to AAB_DOWNLOAD/app-debug.aab."

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: AAB_DOWNLOAD/app-debug.aab
          if-no-files-found: error

      - name: Build Release Bundle (Optional Signing)
        if: env.SIGNING_KEY != ''
        run: ./gradlew bundleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Upload Release AAB Artifact
        if: env.SIGNING_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
